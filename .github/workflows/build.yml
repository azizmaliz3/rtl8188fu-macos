name: CI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version
      - name: Build Debug
        run: xcodebuild -jobs 1 -target RtlWifiDriver -configuration Debug
      - name: Build Release
        run: xcodebuild -jobs 1 -target RtlWifiDriver -configuration Release
      - name: Inspect result
        run: |
          find build -maxdepth 3 -name "*.kext"
          lipo -info build/Release/RtlWifiDriver.kext/Contents/MacOS/RtlWifiDriver
          otool -hv build/Release/RtlWifiDriver.kext/Contents/MacOS/RtlWifiDriver
          plutil -p build/Release/RtlWifiDriver.kext/Contents/Info.plist
      - name: Package
        run: |
          (cd build/Debug && zip -qry ../../RtlWifiDriver-Debug.zip RtlWifiDriver.kext)
          (cd build/Release && zip -qry ../../RtlWifiDriver-Release.zip RtlWifiDriver.kext)
      - uses: actions/upload-artifact@v4
        with:
          name: RtlWifiDriver-kext
          path: RtlWifiDriver-*.zip